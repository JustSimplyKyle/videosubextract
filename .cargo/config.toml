[unstable]
codegen-backend = true

[profile.dev]
opt-level = 0
debug = 1
codegen-backend = "cranelift"

[profile.dev.package."*"]
opt-level = 3
codegen-backend = "llvm"

[target.x86_64-unknown-linux-gnu]
linker = "clang-mold"
rustflags = [
  # (Nightly) Make the current crate share its generic instantiations
  "-Zshare-generics=y",
]
