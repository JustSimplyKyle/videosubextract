[package]
name = "videosubextract"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "An application that extracts hard-subs into srt files"
repository = "https://github.com/pop-os/cosmic-app-template"

[workspace]
members = ["crates/vse-ui"]
resolver = "3"

[workspace.dependencies]
iced = { path = "../iced-dioxus", default-features = false, features = [
    "advanced",
    "canvas",
    "image-without-codecs",
    "svg",
    "tokio",
    "wgpu",
    "web-colors",
    "x11",
    "wayland",
] }

[patch.crates-io]
# Experiment: avoid cosmic-text repeatedly discarding its font-match cache when
# a mix of UI and subtitle text produces more than 256 matching configurations.
cosmic-text = { path = "vendor/cosmic-text" }

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eyre = "0.6.12"
ffmpeg-the-third = "5.0.0"
futures = "0.3"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"

opencv = { version = "0.99.0", features = ["clang-runtime"]}
rust-embed = "8.8.0"
ocr-rs = "2.3.1"
serde = { version = "1", features = ["derive"] }

tokio = { version = "1.48.0", features = ["full"] }
image = "0.25.10"
rfd = "0.16.0"
opencc = "0.3.0"
ffmpeg-sidecar = "2.5.2"
indicatif = "0.18.6"
indexmap = "2"
rayon = "1.12.0"
libloading = "0.9.0"
derive_more = { version = "2.1.1", features = ["debug"] }
cosmic-config = { path = "../libcosmic/cosmic-config", default-features = false, features = ["macro"] }
iced = { workspace = true }
vse-ui = { path = "crates/vse-ui" }

# iced master pins the wasm-bindgen family while rfd leaves it unconstrained.
js-sys = "=0.3.85"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"

[build-dependencies]
cmake = "0.1.54"
pkg-config = "0.3.32"

[features]
debug = ["iced/debug"]
hot-patch = ["iced/hot"]

[profile.samply]
inherits = "release"
debug = true
